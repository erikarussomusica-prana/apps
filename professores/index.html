<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Professores Prana</title>
<meta name="theme-color" content="#0E5A56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Professores">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0E5A56}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  .msg{color:#fff;font:16px system-ui,sans-serif;text-align:center;padding:30vh 24px 0;max-width:460px;margin:0 auto}
  .msg b{font-size:44px;display:block;margin-bottom:10px}
</style>
</head>
<body>
<script>
  /* Ponte da Prana: o link do app chega UMA vez depois do # (ex.: .../professores/#u=LINK) e fica guardado
     neste celular. Depois, o ícone da tela inicial abre direto. Nenhum link nem chave fica neste site. */
  var CHAVE = 'ponte_professores', MODO = 'frame';
  var ok = function (u) { return typeof u === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec([?][\w=&%.-]*)?$/.test(u); };
  var h = location.hash.match(/[#&]u=([^&]+)/), u = '';
  if (h) { try { u = decodeURIComponent(h[1]); } catch (e) {} }
  if (ok(u)) { try { localStorage.setItem(CHAVE, u); } catch (e) {} history.replaceState(null, '', location.pathname); }
  else { try { u = localStorage.getItem(CHAVE) || ''; } catch (e) {} }
  if (!ok(u)) {
    document.body.innerHTML = '<div class="msg"><b>🧑‍🏫</b><p>Abra este app pela <strong>Central da Prana</strong>, no botão <strong>📲 Instalar no celular</strong>.</p><p>Depois, no Chrome: ⋮ → <strong>Instalar app</strong>.</p></div>';
  } else if (MODO === 'ir') {
    var instalado = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    if (instalado) { location.replace(u); }
    else {
      document.body.innerHTML = '<div class="msg"><b>🧑‍🏫</b><p><strong>Professores Prana</strong> pronto para instalar.</p><p>No Chrome, toque em <strong>⋮</strong> (canto de cima) → <strong>Instalar app</strong> ou <strong>Adicionar à tela inicial</strong>.</p><p style="margin-top:28px"><a href="' + u.replace(/"/g, '') + '" style="display:inline-block;background:#fff;color:#0E5A56;padding:12px 22px;border-radius:10px;font-weight:700;text-decoration:none">Abrir agora sem instalar</a></p></div>';
    }
  } else {
    var f = document.createElement('iframe');
    f.src = u; f.title = 'Professores Prana';
    f.allow = 'microphone; camera; clipboard-read; clipboard-write; autoplay; fullscreen; geolocation';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
